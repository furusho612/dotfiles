[defaults]
# モジュールを実行する Python は inventory/group_vars/all.yml の
# ansible_python_interpreter で ansible-playbook 自身のインタプリタ
# (= ansible_playbook_python) に固定している。
#
# ここでバージョン非依存のパス (/opt/homebrew/bin/python3 など) を interpreter_python に
# 指定してはいけない。Homebrew の Python は更新でメジャーバージョンが上がるため、
# ansible-core が未対応のバージョン (例: 3.15) を掴むと module_utils の import が壊れ、
# "AttributeError: module 'dataclasses' has no attribute '_is_type'" で
# すべてのモジュールが実行できなくなる。
#
# group_vars が効かない場面 (別インベントリでの ad-hoc 実行など) に備えて、
# 自動検出 (auto_silent) を既定にしておく。自動検出は ansible-core が
# INTERPRETER_PYTHON_FALLBACK で認識しているバージョンを優先して探索するため、
# 未対応の最新バージョンを掴む可能性を下げられる。
interpreter_python=auto_silent
